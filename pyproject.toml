[project]
name = "datamate"
version = "0.1.0"
description = "Vietnamese table-QA agent: LLM writes pandas code, Python computes, abstains when unsure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "python-calamine>=0.9.0",
    "openai>=3.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
